services:
  pipeline-debugger:
    build: .
    container_name: pipeline-debugger
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./example:/app/example
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped